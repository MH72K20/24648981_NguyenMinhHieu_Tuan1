<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    <style>
        body {
            background-color: #8cc4ff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 600px;
            text-align: center;
        }
        .banner {
            display: inline-block;
            background-color: #00ffff;
            border: 2px solid #000;
            padding: 10px 40px;
            box-shadow: 5px 5px 0px #555;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            line-height: 1.2;
        }
        form {
            text-align: left;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            padding: 4px 0;
            vertical-align: top;
        }
        .label {
            width: 170px;
        }
        input[type="text"], select, textarea {
            border: 1px solid #7f9db9;
        }
        input[type="text"] {
            padding: 2px;
        }
        hr {
            border: none;
            border-top: 1px solid #5588cc;
            margin: 15px 0;
        }
        .radio-group, .checkbox-group {
            display: inline-block;
            vertical-align: top;
        }
        .radio-group label, .checkbox-group label {
            display: inline-block;
            width: 160px;
            margin-bottom: 3px;
        }
        .buttons {
            text-align: center;
            margin-top: 15px;
        }
        .buttons input {
            padding: 3px 12px;
            margin: 0 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="banner">
            ⚡ Jackson<br>Electronics
        </div>

        <h2>Registration Form</h2>
        <p style="text-align: center;">Register your Jackson Electronics product here</p>

        <form action="#" method="post">
            <table>
                <tr>
                    <td class="label"><label for="fname">First Name:</label></td>
                    <td colspan="3">
                        <input type="text" id="fname" name="fname" size="20">
                        <label for="lname">Last Name:</label>
                        <input type="text" id="lname" name="lname" size="20">
                    </td>
                </tr>
                <tr>
                    <td class="label"><label for="addr1">Address #1:</label></td>
                    <td colspan="3"><input type="text" id="addr1" name="addr1" size="35"></td>
                </tr>
                <tr>
                    <td class="label"><label for="addr2">Address #2:</label></td>
                    <td colspan="3"><input type="text" id="addr2" name="addr2" size="35"></td>
                </tr>
                <tr>
                    <td class="label"><label for="city">City:</label></td>
                    <td colspan="3">
                        <input type="text" id="city" name="city" size="22">
                        <label for="state">State:</label>
                        <input type="text" id="state" name="state" size="5">
                        <label for="zip">Zip:</label>
                        <input type="text" id="zip" name="zip" size="10">
                    </td>
                </tr>
                <tr>
                    <td class="label"><label for="country">Country:</label></td>
                    <td colspan="3">
                        <input type="text" id="country" name="country" value="United States" size="22">
                    </td>
                </tr>
            </table>

            <hr>

            <table>
                <tr>
                    <td class="label"><label for="product">Product:</label></td>
                    <td>
                        <select id="product" name="product">
                            <option value="scanmaster">ScanMaster</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td class="label"><label for="date">Date Purchased:</label></td>
                    <td><input type="text" id="date" name="date" size="25"></td>
                </tr>
                <tr>
                    <td class="label"><label for="serial">Serial #:</label></td>
                    <td><input type="text" id="serial" name="serial" size="25"></td>
                </tr>
                <tr>
                    <td class="label">Used for:</td>
                    <td>
                        <div class="radio-group">
                            <label><input type="radio" name="used_for" value="home"> Home</label>
                            <label><input type="radio" name="used_for" value="edu"> Educational Institution</label><br>
                            <label><input type="radio" name="used_for" value="business" checked> Business</label>
                            <label><input type="radio" name="used_for" value="other"> Other</label><br>
                            <label><input type="radio" name="used_for" value="government"> Government</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="label">System (check all that apply):</td>
                    <td>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="system" value="windows"> Windows</label>
                            <label><input type="checkbox" name="system" value="unix"> UNIX</label><br>
                            <label><input type="checkbox" name="system" value="macintosh"> Macintosh</label>
                            <label><input type="checkbox" name="system" value="other"> Other</label>
                        </div>
                    </td>
                </tr>
            </table>

            <hr>

            <table>
                <tr>
                    <td class="label"><label for="comments">Comments?:</label></td>
                    <td>
                        <textarea id="comments" name="comments" rows="6" cols="50"></textarea>
                    </td>
                </tr>
            </table>

            <div class="buttons">
                <input type="submit" value="Click to register">
                <input type="reset" value="Click to cancel">
            </div>
        </form>
    </div>

</body>
</html>
